<html lang="es">
<head>

<body>

    <div class="app-container">
        <!-- Fondo azul superior con curva -->
        <div class="profile-header-bg">
            <div class="status-bar">
                <div class="status-time">9:41</div>
                <div class="status-icons">
                    <span>📶</span>
                    <span>🔋</span>
                </div>
            </div>
            
            <div class="top-nav">
                <span class="back-arrow">←</span>
                <h1>Mi perfil</h1>
            </div>
        </div>

        <!-- Contenido principal con margen negativo para subir sobre el azul -->
        <div class="profile-content">
            
            <!-- Foto y Nombre -->
            <div class="profile-user-info">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="Valeria Gómez" class="avatar-img">
                    <div class="camera-badge">📷</div>
                </div>
                <h2>Valeria Gómez</h2>
                <p>valeria@cliengo.com</p>
            </div>

            <!-- Lista de Opciones -->
            <div class="options-card">
                <div class="option-item">
                    <span class="option-icon">👤</span>
                    <span class="option-text">Información personal</span>
                    <span class="arrow">›</span>
                </div>
                <div class="option-item">
                    <span class="option-icon">🔒</span>
                    <span class="option-text">Cambiar contraseña</span>
                    <span class="arrow">›</span>
                </div>
                <div class="option-item">
                    <span class="option-icon">👑</span>
                    <span class="option-text">Plan actual</span>
                    <div class="plan-badge">ClienGo Pro ✓</div>
                </div>
                <div class="option-item">
                    <span class="option-icon">💳</span>
                    <span class="option-text">Métodos de pago</span>
                    <span class="arrow">›</span>
                </div>
                <div class="option-item">
                    <span class="option-icon">🔔</span>
                    <span class="option-text">Notificaciones</span>
                    <span class="arrow">›</span>
                </div>
                <div class="option-item no-border">
                    <span class="option-icon">❓</span>
                    <span class="option-text">Ayuda y soporte</span>
                    <span class="arrow">›</span>
                </div>
            </div>

            <!-- Botón Cerrar Sesión -->
            <div class="logout-card">
                <div class="option-item no-border">
                    <span class="option-icon logout-icon">↪️</span>
                    <span class="option-text logout-text">Cerrar sesión</span>
                </div>
            </div>

        </div>

    <nav class="bottom-nav">
