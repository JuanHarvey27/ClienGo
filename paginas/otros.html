<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClienGo Otros</title>
    <link rel="stylesheet" href="../Css/otros.css">
</head>
<body>

    <div class="app-container">     
        <div class="profile-header-bg">           
            <div class="status-bar" style="display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; color: #FFFFFF;">
                <div class="status-time" style="font-weight: 600; font-size: 14px;">9:41</div>      
                <div class="status-icons" style="display: flex; align-items: center; gap: 6px;">
                    <div class="icon-signal" style="display: flex; align-items: flex-end; gap: 2px; height: 10px;">
                        <span style="display: block; width: 3px; height: 30%; background: currentColor; border-radius: 0.5px;"></span>
                        <span style="display: block; width: 3px; height: 50%; background: currentColor; border-radius: 0.5px;"></span>
                        <span style="display: block; width: 3px; height: 75%; background: currentColor; border-radius: 0.5px;"></span>
                        <span style="display: block; width: 3px; height: 100%; background: currentColor; border-radius: 0.5px;"></span>
                    </div>
                    
                    <div class="icon-wifi" style="display: flex; align-items: center;">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 21l-12-12c2.4-2.4 5.6-3.7 9-3.7s6.6 1.3 9 3.7l-12 12zm0-15.5c-2.4 0-4.7.9-6.4 2.6l6.4 6.4 6.4-6.4c-1.7-1.7-4-2.6-6.4-2.6z"/>
                        </svg>
                    </div>
                    
                    <div class="icon-battery" style="width: 22px; height: 11px; border: 1px solid currentColor; border-radius: 3px; padding: 1px; position: relative; display: flex; align-items: center; box-sizing: border-box;">
                        <div class="icon-battery-level" style="width: 100%; height: 100%; background: currentColor; border-radius: 1px;"></div>
                        <div style="position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; background: currentColor; border-top-right-radius: 1px; border-bottom-right-radius: 1px;"></div>
                    </div>
                </div>
            </div>
           
            <div class="top-nav" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF;">
                <a href="../index.html" style="text-decoration: none; color: inherit; display: inline-flex; align-items: center;">
                    <div class="back-btn" style="cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;">
                        <svg viewBox="0 0 24 24" style="width: 100%; height: 100%; fill: currentColor;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    </div>
                </a>
                <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Mi perfil</h1>
            </div>
        </div> 

        <!-- Contenido principal con margen negativo para subir sobre el azul -->
        <div class="profile-content">
            
            <!-- Foto y Nombre -->
            <div class="profile-user-info">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="Valeria Gómez" class="avatar-img">
                    <div class="camera-badge">📷</div>
                </div>
                <h2>Valeria Gómez</h2>
                <p>valeria@cliengo.com</p>
            </div>

            <!-- Lista de Opciones -->
            <div class="options-card">
                <div class="option-item">
                    <span class="option-icon">👤</span>
                    <span class="option-text">Información personal</span>
                    <span class="arrow">›</span>
                </div>
                <div class="option-item">
                    <span class="option-icon">🔒</span>
                    <span class="option-text">Cambiar contraseña</span>
                    <span class="arrow">›</span>
                </div>
                <div class="option-item">
                    <span class="option-icon">👑</span>
                    <span class="option-text">Plan actual</span>
                    <div class="plan-badge">ClienGo Pro ✓</div>
                </div>
                <div class="option-item">
                    <span class="option-icon">💳</span>
                    <span class="option-text">Métodos de pago</span>
                    <span class="arrow">›</span>
                </div>
                <div class="option-item">
                    <span class="option-icon">🔔</span>
                    <span class="option-text">Notificaciones</span>
                    <span class="arrow">›</span>
                </div>
                <div class="option-item no-border">
                    <span class="option-icon">❓</span>
                    <span class="option-text">Ayuda y soporte</span>
                    <span class="arrow">›</span>
                </div>
            </div>

            <!-- Botón Cerrar Sesión -->
            <div class="logout-card">
                <div class="option-item no-border">
                    <span class="option-icon logout-icon">↪️</span>
                    <span class="option-text logout-text">Cerrar sesión</span>
                </div>
            </div>

        </div>

    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <div>Inicio</div>
        </a>

        <a href="/paginas/clientes.html" class="nav-item" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 3s1.34 3 5 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
            <div>Clientes</div>
        </a>

        <a href="/paginas/ventas.html" class="nav-item" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            <div>Ventas</div>
        </a>

        <a href="/paginas/productos.html" class="nav-item" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z"/></svg>
            <div>Productos</div>
        </a>

        <a href="/paginas/otros.html" class="nav-item active" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <div>Más</div>
        </a>
    </nav>
    
    </div>

</body>
</html>
