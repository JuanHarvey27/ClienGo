<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClienGo Dashboard</title>
    <link rel="stylesheet" href="../Css/dashboard.css">
</head>
<body>

    <div class="app-container content-white-bg">
        
        <div class="top-blue-container">
            <div class="status-bar">
                <div class="status-time">9:41</div>
                <div class="status-icons">
                    <div class="icon-signal">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <div class="icon-wifi">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-12-12c2.4-2.4 5.6-3.7 9-3.7s6.6 1.3 9 3.7l-12 12zm0-15.5c-2.4 0-4.7.9-6.4 2.6l6.4 6.4 6.4-6.4c-1.7-1.7-4-2.6-6.4-2.6z"/></svg>
                    </div>
                    <div class="icon-battery">
                        <div class="icon-battery-level"></div>
                    </div>
                </div>
            </div>

            <header class="header-inline">
                <div class="header-back-title">
                    <div class="back-btn">
                        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    </div>
                    <h1>Reportes</h1>
                </div>
            </header>
        </div>

        <div class="main-content">
            
            <div class="filters-container">
                <div class="filter-select">
                    <span>Ventas</span>
                    <span class="arrow-down">⌄</span>
                </div>
                <div class="filter-select">
                    <span>Este mes</span>
                    <span class="arrow-down">⌄</span>
                </div>
            </div>

            <div class="card-report total-sales-card">
                <div class="sales-info">
                    <p class="card-title">Ventas totales</p>
                    <p class="sales-amount">$7.560.000</p>
                    <div class="trend-green">
                        <span class="arrow-up">↗</span>
                        <span><strong>18%</strong> vs mes pasado</span>
                    </div>
                </div>
                <div class="badge-money-icon">$</div>
            </div>

            <div class="card-report">
                <p class="card-title-dark">Ventas por dia</p>
                
                <div class="bar-chart-container">
                    <div class="y-axis">
                        <span>$800K</span>
                        <span>$600K</span>
                        <span>$400K</span>
                        <span>$200K</span>
                        <span>$0</span>
                    </div>
                    
                    <div class="chart-bars-area">
                        <div class="grid-line line-1"></div>
                        <div class="grid-line line-2"></div>
                        <div class="grid-line line-3"></div>
                        <div class="grid-line line-4"></div>

                        <div class="bar-wrapper"><div class="bar" style="height: 12%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 25%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 50%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 85%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 65%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 50%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 35%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 30%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 50%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 64%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 85%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 50%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 44%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 35%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 64%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 35%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 25%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 15%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 30%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 45%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 85%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 65%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 50%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 35%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 44%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 44%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 35%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 50%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 75%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 50%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 30%;"></div></div>
                        <div class="bar-wrapper"><div class="bar" style="height: 12%;"></div></div>
                    </div>
                </div>

                <div class="x-axis">
                    <span>1</span>
                    <span>6</span>
                    <span>11</span>
                    <span>16</span>
                    <span>21</span>
                    <span>26</span>
                    <span>31</span>
                </div>
            </div>

            <div class="card-report">
                <p class="card-title-dark">Ventas por categoria</p>
                
                <div class="category-chart-section">
                    <div class="donut-chart"></div>
                    
                    <div class="chart-legend-list">
                        <div class="legend-item">
                            <span class="dot-color blue-dot"></span>
                            <div class="legend-info">
                                <span class="category-name">Accesorios</span>
                                <div class="category-numbers">
                                    <span class="percentage">60%</span>
                                    <span class="money">$4.536.000</span>
                                </div>
                            </div>
                        </div>
                        <div class="legend-item">
                            <span class="dot-color orange-dot"></span>
                            <div class="legend-info">
                                <span class="category-name">Tecnología</span>
                                <div class="category-numbers">
                                    <span class="percentage">25%</span>
                                    <span class="money">$1.890.000</span>
                                </div>
                            </div>
                        </div>
                        <div class="legend-item">
                            <span class="dot-color red-dot"></span>
                            <div class="legend-info">
                                <span class="category-name">Otros</span>
                                <div class="category-numbers">
                                    <span class="percentage">15%</span>
                                    <span class="money">$1.134.000</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item active" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <div>Inicio</div>
        </a>
        <a href="/paginas/clientes.html" class="nav-item" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 3s1.34 3 5 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <div>Clientes</div>
        </a>
        <a href="/paginas/ventas.html" class="nav-item" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.89-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            <div>Ventas</div>
        </a>
        <a href="/paginas/productos.html" class="nav-item" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z"/></svg>
            <div>Productos</div>
        </a>
        <a href="/paginas/otros.html" class="nav-item" style="text-decoration: none; color: inherit;">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <div>Más</div>
        </a>
    </nav>

    </div>

</body>
</html>
