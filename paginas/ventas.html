<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClienGo Ventas</title>
    <link rel="stylesheet" href="../Css/ventas.css">
</head>
<body>

    <div class="app-container content-white-bg">
        
        <div class="top-blue-container">
            <div class="status-bar">
                <div class="status-time">9:41</div>
                <div class="status-icons">
                    <div class="icon-signal">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <div class="icon-wifi">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-12-12c2.4-2.4 5.6-3.7 9-3.7s6.6 1.3 9 3.7l-12 12zm0-15.5c-2.4 0-4.7.9-6.4 2.6l6.4 6.4 6.4-6.4c-1.7-1.7-4-2.6-6.4-2.6z"/></svg>
                    </div>
                    <div class="icon-battery">
                        <div class="icon-battery-level"></div>
                    </div>
                </div>
            </div>

            <header class="header-inline">
                <div class="header-back-title">
                    <div class="back-btn">
                        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    </div>
                    <h1>Nueva venta</h1>
                </div>
            </header>
        </div>

        <div class="main-content">
            
            <div class="form-group">
                <label class="section-label">Cliente</label>
                <div class="select-client-box">
                    <span>Juan Pérez</span>
                    <span class="arrow-select">›</span>
                </div>
            </div>

            <div class="form-group">
                <label class="section-label">Productos</label>
                
                <div class="product-card">
                    <div class="product-img-placeholder">🎧</div>
                    <div class="product-details">
                        <h3>Audifonos Inalámbricos</h3>
                        <p class="product-price">$80.000</p>
                    </div>
                    <div class="product-actions">
                        <div class="stepper">
                            <button class="step-btn">−</button>
                            <span class="step-value">1</span>
                            <button class="step-btn">+</button>
                        </div>
                        <button class="delete-btn">🗑️</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-img-placeholder">⌚</div>
                    <div class="product-details">
                        <h3>Reloj Inteligente</h3>
                        <p class="product-price">$150.000</p>
                    </div>
                    <div class="product-actions">
                        <div class="stepper">
                            <button class="step-btn">−</button>
                            <span class="step-value">1</span>
                            <button class="step-btn">+</button>
                        </div>
                        <button class="delete-btn">🗑️</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-img-placeholder">🔊</div>
                    <div class="product-details">
                        <h3>Parlante Bluetooth</h3>
                        <p class="product-price">$120.000</p>
                    </div>
                    <div class="product-actions">
                        <div class="stepper">
                            <button class="step-btn">−</button>
                            <span class="step-value">1</span>
                            <button class="step-btn">+</button>
                        </div>
                        <button class="delete-btn">🗑️</button>
                    </div>
                </div>

                <button class="add-product-btn">＋ Agregar producto</button>
            </div>

            <div class="totals-section">
                <div class="total-row">
                    <span class="total-label">Subtotal</span>
                    <span class="total-value">$350.000</span>
                </div>
                <div class="total-row">
                    <span class="total-label">Descuento</span>
                    <span class="total-value">$0</span>
                </div>
                <div class="total-row main-total">
                    <span class="total-label">Total</span>
                    <span class="total-value-highlight">$350.000</span>
                </div>
            </div>

            <div class="form-group">
                <label class="section-label">Estado de pago</label>
                <div class="payment-status-container">
                    <button class="status-option option-pending">Pendiente</button>
                    <button class="status-option option-paid active">Pagado</button>
                </div>
            </div>

            <button class="save-sale-btn">Guardar venta</button>

        </div>
    </div>

</body>
</html>
